name: PF-I16 guarded switch certificate

on:
  push:
    branches:
      - research/pf-i16-superrow-cut-covariance-2026-11-15
    paths:
      - "research/verification/verify_pf_i16_local_switch_fractional_transport.py"
      - "research/verification/verify_pf_i16_guarded_switch_injective_assignment.py"
      - "research/verification/verify_pf_i16_guarded_switch_lexicographic_rule.py"
      - "research/verification/verify_pf_i16_fixed_order_inductive_candidate.py"
      - ".github/workflows/pf-i16-guarded-switch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact guarded transition enumeration
        run: python research/verification/verify_pf_i16_local_switch_fractional_transport.py
      - name: Test source-saturating injective assignment
        run: python research/verification/verify_pf_i16_guarded_switch_injective_assignment.py
      - name: Test deterministic lexicographic augmenting rule
        run: python research/verification/verify_pf_i16_guarded_switch_lexicographic_rule.py
      - name: Diagnose eight-order canonical subrelation and report Hall witness
        run: python research/verification/verify_pf_i16_fixed_order_inductive_candidate.py
