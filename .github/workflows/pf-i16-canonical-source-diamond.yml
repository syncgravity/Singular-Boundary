name: PF-I16 canonical source-diamond census
on:
  push:
    branches:
      - research/pf-i16-admissible-exchange-2026-11-16
  workflow_dispatch:
jobs:
  canonical-source-diamond:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact canonical source-diamond census
        working-directory: research/verification
        run: python verify_pf_i16_canonical_source_diamond.py
