name: PF-I16 n=10 four-order subgraph
on:
  push:
    branches:
      - research/pf-i16-admissible-exchange-2026-11-16
  workflow_dispatch:
jobs:
  four-order-subgraph:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and match four-order n=10 subgraph
        working-directory: research/verification
        run: python verify_pf_i16_four_order_subgraph_n10.py
