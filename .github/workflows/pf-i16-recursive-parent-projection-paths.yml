name: PF-I16 recursive parent-projection paths

on:
  push:
    branches:
      - research/pf-i16-parent-fiber-exchange-2026-11-23
    paths:
      - research/verification/verify_pf_i16_recursive_parent_projection_paths.py
      - research/verification/verify_pf_i16_cross_source_reverse_mark_exchange.py
      - research/verification/verify_pf_i16_projection_shifting_transitions.py
      - .github/workflows/pf-i16-recursive-parent-projection-paths.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parent-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PF-I16 parent-fiber exchange branch
        uses: actions/checkout@v4
        with:
          ref: research/pf-i16-parent-fiber-exchange-2026-11-23
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run recursive parent-projection path test
        run: |
          python research/verification/verify_pf_i16_recursive_parent_projection_paths.py \
            --output pf_i16_recursive_parent_projection_paths.json
      - name: Upload parent-projection paths and witnesses
        uses: actions/upload-artifact@v4
        with:
          name: pf-i16-recursive-parent-projection-paths-n6-n8
          path: pf_i16_recursive_parent_projection_paths.json
          if-no-files-found: error
          retention-days: 90
