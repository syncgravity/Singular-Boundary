name: PF-I16 global alternating reroute
on:
  push:
    branches:
      - research/pf-i16-admissible-exchange-2026-11-16
  workflow_dispatch:
jobs:
  global-alternating-reroute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test global alternating collision reroutes
        working-directory: research/verification
        run: python verify_pf_i16_global_alternating_reroute.py
