name: PF-I16 n=10 canonical-order subgraph
on:
  push:
    branches:
      - research/pf-i16-admissible-exchange-2026-11-16
  workflow_dispatch:
jobs:
  canonical-subgraph:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and match canonical-order subgraph
        working-directory: research/verification
        run: python verify_pf_i16_canonical_order_subgraph_n10.py
