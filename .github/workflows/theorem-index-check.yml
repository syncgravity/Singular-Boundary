permissions:
  contents: read
jobs:
  index-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Install numerical verifier dependency
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Enumerate all one-to-three-rhombus four-interval support candidates
        run: |
          python research/scripts/verify_pf_i16_hall_four_interval_support_inventory.py --output /tmp/pf_i16_four_interval_support_inventory.json > /tmp/pf_i16_four_interval_support_inventory.stdout
          python - <<'PY'
          import json
          p = "/tmp/pf_i16_four_interval_support_inventory.json"
          x = json.load(open(p, encoding="utf-8"))
          keys = ("target", "original_source_control", "eligible_matched_edges",
                  "eligible_edges_vertex_disjoint_from_frozen_triple",
                  "total_support_options_all_eligible_edges",
                  "minimum_strict_vertex_margin", "minimum_strict_face_margin")
          print(json.dumps({k: x[k] for k in keys}, sort_keys=True))
          PY
      - name: Upload four-interval support inventory
        uses: actions/upload-artifact@v4
        with:
          name: pf-i16-four-interval-support-inventory
          path: /tmp/pf_i16_four_interval_support_inventory.json
          if-no-files-found: error
      - name: Test four-interval parent compatibility and bounded fourth-edge obstruction
        run: python research/scripts/verify_pf_i16_hall_four_interval_parent_compatibility.py --inventory /tmp/pf_i16_four_interval_support_inventory.json --output /tmp/pf_i16_four_interval_parent_compatibility.json
      - name: Upload four-interval parent-compatibility result
        uses: actions/upload-artifact@v4
        with:
          name: pf-i16-four-interval-parent-compatibility
          path: /tmp/pf_i16_four_interval_parent_compatibility.json
          if-no-files-found: error
      - name: Search third-edge replacements with the first two motif edges anchored
        run: python research/scripts/verify_pf_i16_hall_four_interval_two_edge_anchored_search.py --inventory /tmp/pf_i16_four_interval_support_inventory.json --output /tmp/pf_i16_four_interval_two_edge_anchored_search.json
      - name: Upload two-edge-anchored motif search
        uses: actions/upload-artifact@v4
        with:
          name: pf-i16-four-interval-two-edge-anchored-search
          path: /tmp/pf_i16_four_interval_two_edge_anchored_search.json
          if-no-files-found: error
      - name: Enumerate second-edge frontier with first matched edge anchored
        run: python research/scripts/verify_pf_i16_hall_four_interval_second_edge_frontier.py --inventory /tmp/pf_i16_four_interval_support_inventory.json --output /tmp/pf_i16_four_interval_second_edge_frontier.json
      - name: Upload second-edge frontier
        uses: actions/upload-artifact@v4
        with:
          name: pf-i16-four-interval-second-edge-frontier
          path: /tmp/pf_i16_four_interval_second_edge_frontier.json
          if-no-files-found: error
      # The replacement search rechecks every frontier support-pair count and edge-set digest.
      - name: Search second-edge replacements against graph-5 and graph-12 attachments
        run: |
          python research/scripts/verify_pf_i16_hall_four_interval_second_edge_replacement_search.py --inventory /tmp/pf_i16_four_interval_support_inventory.json --frontier /tmp/pf_i16_four_interval_second_edge_frontier.json --output /tmp/pf_i16_four_interval_second_edge_replacement_search.json
      - name: Upload second-edge replacement search
        uses: actions/upload-artifact@v4
        with:
          name: pf-i16-four-interval-second-edge-replacement-search
          path: /tmp/pf_i16_four_interval_second_edge_replacement_search.json
          if-no-files-found: error
      - name: Lift aggregated survivors to same-assignment four-support witnesses
        run: |
          python research/scripts/verify_pf_i16_hall_four_interval_witness_lifting.py --inventory /tmp/pf_i16_four_interval_support_inventory.json --replacement /tmp/pf_i16_four_interval_second_edge_replacement_search.json --output /tmp/pf_i16_four_interval_witness_lifting.json
      - name: Upload same-assignment witness-lifting result
        uses: actions/upload-artifact@v4
        with:
          name: pf-i16-four-interval-witness-lifting
          path: /tmp/pf_i16_four_interval_witness_lifting.json
          if-no-files-found: error
      - name: Lift independent four-support assignments to full labelled diagrams
        run: |
          python research/scripts/verify_pf_i16_hall_four_interval_independent_diagram_lifting.py --inventory /tmp/pf_i16_four_interval_support_inventory.json --replacement /tmp/pf_i16_four_interval_second_edge_replacement_search.json --output /tmp/pf_i16_four_interval_independent_diagram_lifting.json
      - name: Upload independent four-support diagram lifting result
        uses: actions/upload-artifact@v4
        with:
          name: pf-i16-four-interval-independent-diagram-lifting
          path: /tmp/pf_i16_four_interval_independent_diagram_lifting.json
          if-no-files-found: error
      - name: Audit actual order-eight parent deletion marks
        run: |
          python research/scripts/verify_pf_i16_four_interval_source_parent_mark_audit.py --output /tmp/pf_i16_four_interval_source_parent_mark_audit.json
      - name: Upload source-parent mark audit
        uses: actions/upload-artifact@v4
        with:
          name: pf-i16-four-interval-source-parent-mark-audit
          path: /tmp/pf_i16_four_interval_source_parent_mark_audit.json
          if-no-files-found: error
      - name: Verify source-labelled four-support restrictions and deletion diamonds
        run: |
          python research/scripts/verify_pf_i16_source_labelled_four_support_restriction_audit.py --diagrams /tmp/pf_i16_four_interval_independent_diagram_lifting.json --inventory /tmp/pf_i16_four_interval_support_inventory.json --output /tmp/pf_i16_source_labelled_four_support_restriction_audit.json.gz
      - name: Upload source-labelled four-support restriction audit
        uses: actions/upload-artifact@v4
        with:
          name: pf-i16-source-labelled-four-support-restriction-audit
          path: /tmp/pf_i16_source_labelled_four_support_restriction_audit.json.gz
          if-no-files-found: error
      - name: Verify source-parent coherence across four-support origins
        run: |
          python research/scripts/verify_pf_i16_four_support_parent_coherence.py --diagrams /tmp/pf_i16_four_interval_independent_diagram_lifting.json --output /tmp/pf_i16_four_support_parent_coherence.json
      - name: Upload four-support source-parent coherence audit
        uses: actions/upload-artifact@v4
        with:
          name: pf-i16-four-support-source-parent-coherence
          path: /tmp/pf_i16_four_support_parent_coherence.json
          if-no-files-found: error
      - name: Verify exact relative-collapse diamond certificates
        run: |
          python research/scripts/verify_pf_i16_four_support_relative_collapse_diamonds.py --inventory /tmp/pf_i16_four_interval_support_inventory.json --diagrams /tmp/pf_i16_four_interval_independent_diagram_lifting.json --output /tmp/pf_i16_four_support_relative_collapse_diamonds.json.gz
      - name: Upload exact relative-collapse diamond certificates
        uses: actions/upload-artifact@v4
        with:
          name: pf-i16-four-support-relative-collapse-diamonds
          path: /tmp/pf_i16_four_support_relative_collapse_diamonds.json.gz
          if-no-files-found: error
      - name: Verify complete theorem source inventory and Git blob hashes
        run: python research/scripts/verify_theorem_index.py --repo .
      - name: Verify generated theorem catalog and current navigator
        run: python observatory/tools/sync_theorem_catalog.py --check
      - name: Verify degree-eight order-four LS arithmetic envelope
        run: python research/verification/verify_pf_i16_degree_eight_ls_constant.py
      - name: Verify PF-I16 product-cumulant bridge counterexample
        run: python research/verification/verify_pf_i16_product_cumulant_bridge.py
      - name: Verify PF-I16 nilpotent gluing and high-degree identities
        run: python research/experiments/pf_i16_nilpotent_gluing_checks.py
      - name: Verify PF-I16 two-hyperedge connected-log interpolation
        run: python research/experiments/pf_i16_two_hyperedge_interpolation.py
      - name: Verify PF-I16 three-hyperedge attachment identities
        run: python research/experiments/pf_i16_three_hyperedge_attachment.py
      - name: Verify PF-I16 joint space-time activity and centering thresholds
        run: python research/verification/verify_pf_i16_joint_spacetime_activity.py
      - name: Verify PF-I16 radial character coefficients and shared-link Casimir contraction
        run: python research/verification/verify_pf_i16_radial_character_casimir.py
      - name: Verify cut-QF insufficiency parity obstruction
        run: python research/verification/verify_pf_i16_support_tree_qf_obstruction.py
      - name: Verify factorial obstruction to support maximum-tree coefficient
        run: python research/verification/verify_pf_i16_support_tree_maximum_bound_obstruction.py
      - name: Verify coordinate-preserving port-completion obstruction
        run: python research/verification/verify_pf_i16_coordinate_port_completion_obstruction.py
      - name: Verify coincident-time support cumulant baseline
        run: python research/verification/verify_pf_i16_coincident_time_support_tree_bound.py
      - name: Verify graph-sensitive coincident cumulant tree bound
        run: python research/verification/verify_pf_i16_graph_sensitive_coincident_cumulant.py
      - name: Verify support-temporal cumulant tree at orders two and three
        run: python research/verification/verify_pf_i16_support_temporal_tree_orders_two_three.py
      - name: Verify all-orders tree-support temporal cumulant bound
        run: python research/verification/verify_pf_i16_tree_support_all_orders_temporal_cumulant.py
      - name: Verify pair-incidence weighted support-tree cumulant bound
        run: python research/verification/verify_pf_i16_pair_incidence_weighted_support_tree.py
      - name: Verify interlaced-time super-row covariance obstruction
        run: python research/verification/verify_pf_i16_interlaced_superrow_covariance_obstruction.py
      - name: Verify bounded multi-time super-row temporal-port budget
        run: python research/verification/verify_pf_i16_superrow_temporal_port_budget.py
      - name: Test multi-cut maximal-correlation conjecture on finite binary chains
        run: python research/verification/verify_pf_i16_multicut_maximal_correlation.py
      - name: Verify discrete-time multi-cut maximal-correlation counterexample
        run: python research/verification/verify_pf_i16_multicut_discrete_time_counterexample.py
      - name: Calibrate hypocoercive three-point bridge bound against OU
        run: python research/verification/verify_pf_i16_hypocoercive_three_point_bridge_bound.py
      - name: Verify CTMC endpoint-conditioned bridge HGR obstruction
        run: python research/verification/verify_pf_i16_ctmc_bridge_conditional_hgr_obstruction.py
      - name: Verify finite-state bridge Doeblin minorization
        run: python research/verification/verify_pf_i16_bridge_doeblin_minorization.py
      - name: Verify all-orders radial character tail and face-pair projective norm
        run: python research/verification/verify_pf_i16_character_tail_projective_norm.py
      - name: Verify exact centering and face-pair joint-tree activity
        run: python research/verification/verify_pf_i16_exact_centering_joint_tree.py
      - name: Verify curated Proof Atlas graph
        run: python observatory/tools/verify_knowledge_graph.py
      - name: Syntax-check Proof Atlas application
        run: node --check observatory/graph-app.js
      - name: Syntax-check branch maintenance script
        run: bash -n scripts/safe_prune_merged_branches.sh
