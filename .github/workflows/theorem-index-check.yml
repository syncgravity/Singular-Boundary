name: Theorem source-index integrity
on:
  pull_request:
    paths:
      - 'research/theorems/**'
      - 'docs/research/THEOREM_INDEX.md'
      - 'docs/research/THEOREM_INDEX_LIVE.json'
      - 'research/scripts/verify_theorem_index.py'
      - 'docs/research/THEOREM_INDEX_CURRENT.md'
      - 'observatory/catalog.js'
      - 'observatory/knowledge-graph.json'
      - 'observatory/knowledge-graph-data.js'
      - 'observatory/tools/sync_theorem_catalog.py'
      - 'observatory/tools/build_knowledge_graph.py'
      - 'observatory/tools/verify_knowledge_graph.py'
      - 'observatory/index.html'
      - 'observatory/graph.html'
      - 'observatory/README.md'
      - '.github/workflows/theorem-index-check.yml'
  push:
    branches: [main]
    paths:
      - 'research/theorems/**'
      - 'docs/research/THEOREM_INDEX.md'
      - 'docs/research/THEOREM_INDEX_LIVE.json'
      - 'research/scripts/verify_theorem_index.py'
      - 'docs/research/THEOREM_INDEX_CURRENT.md'
      - 'observatory/catalog.js'
      - 'observatory/knowledge-graph.json'
      - 'observatory/knowledge-graph-data.js'
      - 'observatory/tools/sync_theorem_catalog.py'
      - 'observatory/tools/build_knowledge_graph.py'
      - 'observatory/tools/verify_knowledge_graph.py'
      - 'observatory/index.html'
      - 'observatory/graph.html'
      - 'observatory/README.md'
permissions:
  contents: read
jobs:
  index-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify complete theorem source inventory and Git blob hashes
        run: python research/scripts/verify_theorem_index.py --repo .
      - name: Verify searchable Observatory, current source navigator and Proof Atlas
        run: |
          python observatory/tools/sync_theorem_catalog.py --check
          python observatory/tools/verify_knowledge_graph.py
          node --check observatory/graph-app.js
          bash -n scripts/safe_prune_merged_branches.sh
