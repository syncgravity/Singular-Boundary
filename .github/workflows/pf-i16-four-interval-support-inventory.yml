name: PF-I16 four-interval support inventory

on:
  push:
    branches:
      - research/pf-i16-z5-incidence-lift-2026-11-18
    paths:
      - 'research/scripts/verify_pf_i16_hall_four_interval_support_inventory.py'
      - '.github/workflows/pf-i16-four-interval-support-inventory.yml'

permissions:
  contents: read

jobs:
  support-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Enumerate all one-to-three-rhombus support options
        run: python research/scripts/verify_pf_i16_hall_four_interval_support_inventory.py --output /tmp/pf_i16_four_interval_support_inventory.json
      - name: Preserve inventory report
        uses: actions/upload-artifact@v4
        with:
          name: pf-i16-four-interval-support-inventory
          path: /tmp/pf_i16_four_interval_support_inventory.json
          if-no-files-found: error
