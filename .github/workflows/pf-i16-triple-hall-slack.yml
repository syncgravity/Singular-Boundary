name: PF-I16 triple Hall-slack census
on:
  push:
    branches:
      - research/pf-i16-admissible-exchange-2026-11-16
  workflow_dispatch:
jobs:
  triple-hall-slack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enumerate every n=8 source triple
        working-directory: research/verification
        run: python verify_pf_i16_triple_hall_slack.py
