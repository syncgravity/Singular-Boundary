name: PF-I16 matching-relative digraph diagnostics
on:
  push:
    branches:
      - research/pf-i16-admissible-exchange-2026-11-16
  workflow_dispatch:
jobs:
  matching-relative-digraph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyze matching-relative digraph
        working-directory: research/verification
        run: python verify_pf_i16_matching_relative_digraph.py
