name: PF-I16 exact n=10 full leaf-last graph
on:
  push:
    branches:
      - research/pf-i16-admissible-exchange-2026-11-16
  workflow_dispatch:
jobs:
  full-leaf-last-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build complete n=10 leaf-last graph and maximum matching
        working-directory: research/verification
        run: python -u verify_pf_i16_full_leaf_last_graph_n10.py
