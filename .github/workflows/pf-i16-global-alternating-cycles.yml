name: PF-I16 global alternating-cycle diagnostic

on:
  push:
    branches:
      - research/pf-i16-admissible-exchange-2026-11-16
    paths:
      - "research/verification/verify_pf_i16_global_alternating_cycles.py"
      - "research/verification/verify_pf_i16_source_dependent_leaf_peeling.py"
      - "research/verification/verify_pf_i16_local_switch_fractional_transport.py"
      - ".github/workflows/pf-i16-global-alternating-cycles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alternating-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test exact global alternating-cycle structure
        run: python research/verification/verify_pf_i16_global_alternating_cycles.py
