name: PF-I16 integer mixed selector Hall (rounded row quotas)

on:
  push:
    branches:
      - research/pf-i16-admissible-exchange-2026-11-16
    paths:
      - research/verification/verify_pf_i16_integer_mixed_selector_hall.py
      - research/verification/search_pf_i16_integer_selector_parent_matching.py
      - research/verification/verify_pf_i16_source_dependent_leaf_peeling.py
      - research/verification/verify_pf_i16_local_switch_fractional_transport.py
      - .github/workflows/pf-i16-integer-mixed-selector-hall.yml
  workflow_dispatch:

jobs:
  integer-selector-hall:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Search parent representatives and test integer mixed selector Hall
        working-directory: research/verification
        run: python search_pf_i16_integer_selector_parent_matching.py
