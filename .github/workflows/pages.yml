name: Research Observatory · GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "observatory/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site artifact
        run: |
          set -euo pipefail
          mkdir -p _site/concepts
          cp observatory/*.html observatory/*.js observatory/*.css observatory/*.json _site/
          rm -f _site/data-manifest.json
          cp observatory/.nojekyll _site/.nojekyll
          cp observatory/MATHEMATICAL_PHYSICS_GUIDE.md _site/
          cp observatory/HISTORICAL_DOUBLE_AUDIT_2026-11-04.md _site/
          cp observatory/PROOF_PATH_DISCOVERY_2026-11-04.md _site/
          cp observatory/concepts/helical-observer-concept-index.json _site/concepts/
      - name: Upload curated public Observatory
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
