name: Observatory local-link integrity
on:
  push:
    branches: [main]
    paths:
      - 'observatory/**'
      - '.github/workflows/observatory-integrity.yml'
  pull_request:
    paths:
      - 'observatory/**'
      - '.github/workflows/observatory-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify local Observatory links and fragments
        run: python observatory/tools/verify_local_links.py
