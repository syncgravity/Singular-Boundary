name: PF-I16 simultaneous two-edge flexibility
on:
  push:
    branches:
      - research/pf-i16-admissible-exchange-2026-11-16
  workflow_dispatch:
jobs:
  simultaneous-two-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test simultaneous two-edge constraints
        working-directory: research/verification
        run: python verify_pf_i16_simultaneous_two_edge_flexibility.py
