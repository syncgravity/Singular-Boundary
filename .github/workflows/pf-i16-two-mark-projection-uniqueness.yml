name: PF-I16 two-mark projection uniqueness

on:
  push:
    branches:
      - research/pf-i16-parent-fiber-exchange-2026-11-23
    paths:
      - research/verification/verify_pf_i16_two_mark_projection_uniqueness.py
      - .github/workflows/pf-i16-two-mark-projection-uniqueness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pf-i16-parent-fiber-exchange-2026-11-23
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact n=6,8 two-mark census
        working-directory: research/verification
        run: python verify_pf_i16_two_mark_projection_uniqueness.py
