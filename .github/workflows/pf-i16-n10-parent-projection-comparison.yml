name: PF-I16 n=10 child to n=8 parent projection comparison
on:
  push:
    branches:
      - research/pf-i16-admissible-exchange-2026-11-16
  workflow_dispatch:
jobs:
  parent-projection-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare complete n=10 child graph with n=8 parent fibers
        working-directory: research/verification
        run: python -u compare_pf_i16_n10_child_to_n8_parent.py
